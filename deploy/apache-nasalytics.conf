# Apache (httpd 2.4) — asicservices.com/nasalytics → 127.0.0.1:8790 (önek soyulur)
# Bu satırlar asicservices.com'un HTTPS (<VirtualHost *:443>) bloğunun İÇİNE girmeli:
#   - Düz httpd: /etc/httpd/conf.d/<site>.conf içindeki 443 bloğuna   Include /opt/nasalytics/deploy/apache-nasalytics.conf
#   - cPanel/WHM: /etc/apache2/conf.d/userdata/ssl/2_4/<cpanel_kullanici>/asicservices.com/nasalytics.conf olarak kopyala,
#                 sonra  /scripts/rebuildhttpdconf && /scripts/restartsrv_httpd
# Gerekli modüller: proxy, proxy_http, proxy_wstunnel (AlmaLinux 8'de varsayılan yüklü).

RedirectMatch 301 ^/nasalytics$ /nasalytics/
ProxyPreserveHost On

# Canlı aktarım (WebSocket) — genel kuraldan ÖNCE olmalı
ProxyPass        /nasalytics/ws/ ws://127.0.0.1:8790/ws/
ProxyPassReverse /nasalytics/ws/ ws://127.0.0.1:8790/ws/

# Arayüz + API (VEGA ve ses akışı tamponlanmasın)
ProxyPass        /nasalytics/ http://127.0.0.1:8790/ timeout=600 flushpackets=on
ProxyPassReverse /nasalytics/ http://127.0.0.1:8790/

<Location /nasalytics/api/>
    SetEnv no-gzip 1
    SetEnv dont-vary 1
</Location>
