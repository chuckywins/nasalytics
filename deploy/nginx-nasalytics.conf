# nginx — asicservices.com'un "server { listen 443 ssl; ... }" bloğunun İÇİNE eklenir (include /opt/nasalytics/deploy/nginx-nasalytics.conf;)
location = /nasalytics { return 301 /nasalytics/; }

location /nasalytics/ws/ {
    proxy_pass http://127.0.0.1:8790/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
}

location /nasalytics/ {
    proxy_pass http://127.0.0.1:8790/;          # sondaki "/" öneki soyar
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;                          # VEGA ve ses akışı (SSE) beklemesin
    proxy_read_timeout 600s;
    client_max_body_size 10m;                     # kamera karesi gönderimi
}
