# OpenLiteSpeed (DirectAdmin) — asicservices.com/nasalytics → 127.0.0.1:8790
# DirectAdmin: Custom HTTPD Configurations → asicservices.com → openlitespeed.conf kutusuna bu dosyanın içeriği yapıştırılır.
# OpenLiteSpeed öneki soymaz; uygulama URL_PREFIX=/nasalytics ile kendisi soyar (deploy/nasalytics.service).
extprocessor nasalytics {
  type                    proxy
  address                 127.0.0.1:8790
  maxConns                200
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

context /nasalytics/ {
  type                    proxy
  handler                 nasalytics
  addDefaultCharset       off
}

websocket /nasalytics/ws/ {
  address                 127.0.0.1:8790
}
